name: Refresh README PDF (one-time)

on:
  push:
    paths:
      - ".github/workflows/refresh-readme-pdf.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned PDF dependencies
        run: |
          python3 -m venv .build/docs-venv
          .build/docs-venv/bin/python -m pip install -r requirements-docs.txt
      - name: Regenerate deterministic PDF and verify
        run: |
          .build/docs-venv/bin/python scripts/export_docs.py
          .build/docs-venv/bin/python scripts/export_docs.py --check
      - name: Commit refreshed PDF
        run: |
          git add -- docs/README.pdf
          if git diff --cached --quiet; then
            echo "PDF is already in sync"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Regenerate README PDF from updated Markdown"
            git push origin HEAD:main
          fi
