name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Host tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test

  nano-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned CLI, core, and libraries
        run: make setup
      - name: Compile Nano 33 BLE firmware
        run: make build JOBS=2
      - name: Archive firmware and build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nano33ble-firmware
          path: .build/artifacts/
          if-no-files-found: error
