name: Refresh README PDF

on:
  push:
    paths:
      - ".github/workflows/refresh-readme-pdf.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repair local anchor links in PDF exporter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/export_docs.py")
          s = p.read_text()
          old = '            if not href.startswith(("http://", "https://", "#")):\n                href = "https://github.com/NetKit-Labs/kwskit/blob/main/" + href'
          new = '            if href.startswith("#"):\n                href = "https://github.com/NetKit-Labs/kwskit" + href\n            elif not href.startswith(("http://", "https://")):\n                href = "https://github.com/NetKit-Labs/kwskit/blob/main/" + href'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Install exact documentation dependencies
        run: |
          python3 -m venv .build/docs-venv
          .build/docs-venv/bin/python -m pip install -r requirements-docs.txt
      - name: Generate and check PDF
        run: |
          .build/docs-venv/bin/python scripts/export_docs.py
          .build/docs-venv/bin/python scripts/export_docs.py --check
      - name: Commit documentation synchronization
        run: |
          git add scripts/export_docs.py docs/README.pdf
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix PDF anchor rendering and regenerate README PDF"
          git push origin HEAD:main
