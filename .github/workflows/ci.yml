name: Build and test

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    source-style:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                name: Install pinned source formatters
                run: |
                    python3 -m venv .build/style-venv
                    .build/style-venv/bin/python -m pip install -r requirements-style.txt
            -
                name: Check four-space C++ and Python formatting
                run: make format-check

    documentation:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                name: Install pinned PDF tools
                run: |
                    python3 -m venv .build/docs-venv
                    .build/docs-venv/bin/python -m pip install -r requirements-docs.txt
            -
                name: Check committed README PDF consistency
                if: github.event_name != 'push'
                run: .build/docs-venv/bin/python scripts/export_docs.py --check
            -
                name: Validate README PDF generation on push
                if: github.event_name == 'push'
                run: |
                    .build/docs-venv/bin/python scripts/export_docs.py
                    .build/docs-venv/bin/python scripts/export_docs.py --check

    host-tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                name: Unit and regression tests with AddressSanitizer and UndefinedBehaviorSanitizer
                run: make test

    nano-firmware:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -
                name: Install pinned CLI, core, and libraries
                run: make setup
            -
                name: Fault-test pinned PDM worker and retry backoff
                run: make test-pdm-driver
            -
                name: Compile Nano firmware and audit real-time imports
                run: make build JOBS=2
            -
                name: Archive firmware and build provenance
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: nano33ble-zephyr-firmware
                    path: .build/zephyr-artifacts/
                    if-no-files-found: error

    cppcheck:
        name: Cppcheck static analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
          - uses: actions/checkout@v4
          - name: Install Cppcheck
            run: sudo apt-get update && sudo apt-get install -y cppcheck
          - name: Analyze project-owned C/C++ sources
            run: |
              cppcheck --error-exitcode=1 --quiet --enable=warning,performance,portability \
                --inline-suppr --suppress=missingIncludeSystem --std=c++20 \
                -Ifirmware firmware
