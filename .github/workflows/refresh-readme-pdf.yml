name: Refresh README PDF

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/export_docs.py"
      - "requirements-docs.txt"
      - ".github/workflows/refresh-readme-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-pdf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned documentation dependencies
        run: |
          python3 -m venv .build/docs-venv
          .build/docs-venv/bin/python -m pip install -r requirements-docs.txt

      - name: Regenerate and check README PDF
        run: |
          .build/docs-venv/bin/python scripts/export_docs.py
          .build/docs-venv/bin/python scripts/export_docs.py --check

      - name: Commit updated PDF if needed
        run: |
          git add docs/README.pdf
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync README PDF with updated documentation"
            git push origin HEAD:main
          else
            echo "README PDF already up to date"
          fi
